# Dependabot keeps the pinned tools current: the workflows' actions, each
# pinned to a commit with its release named in a comment; the hash-locked
# Semgrep and build tooling the workflows install; and the ClamAV image
# the malware scan runs, pinned by digest. The package itself depends on
# nothing, and its development tools are minimum versions that CI installs
# at their latest. The YARA-X engine is a release download no updater
# follows (the Security workflow says how to move it), and the YARA Forge
# rules have their own weekly workflow.
#
# A release waits a week before it is proposed, long enough for most
# hijacked or broken releases to be found and pulled first. Security
# updates do not wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /.github/security
      - /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /.github/security/clamav
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

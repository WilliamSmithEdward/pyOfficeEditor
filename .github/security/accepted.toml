# What the security scans are expected to report, and why each is accepted.
#
# scripts/security/security_report.py fails a scan on any finding, or any
# warning a tool raises about the scan, that this file does not list, and
# on any entry here that no longer matches. A finding is matched by tool,
# rule, file and the text of the line it flags, so it follows code that
# moves and comes back up for review when the line itself changes.
#
# Add an entry only with a reason a reviewer can check. Fixing the code
# is the better answer wherever there is one.
#
# Entries take this shape:
#
# [[finding]]
# tool = "Semgrep"
# rule = "the rule id"
# where = [
#     { path = "src/pyofficeeditor/file.py", line = "the flagged line" },
# ]
# reason = """
# Why the finding does not apply here.
# """

[[finding]]
tool = "CodeQL"
rule = "py/overly-large-range"
where = [
    { path = "src/pyofficeeditor/excel/_filters.py", line = '_NOT_XML = re.compile("[\x00-\x08\x0b\x0c\x0e-\x1f\ufffe\uffff]")' },
    { path = "src/pyofficeeditor/excel/_xstring.py", line = '_NOT_XML = re.compile("[\x00-\x08\x0b\x0c\x0e-\x1f\ud800-\udfff\ufffe\uffff]")' },
]
reason = """
Each class is the set of characters XML 1.0 cannot hold: the C0 controls
other than tab, line feed and carriage return, and U+FFFE and U+FFFF,
with the lone surrogates in _xstring.py. The range \\x0e-\\x1f is meant
to span every control from U+000E to U+001F. The filter code refuses a
criterion that holds one, and _xstring.py replaces one with U+FFFD
before it is written.
"""

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10.21", "3.11.16", "3.12.14", "3.13.15", "3.14.7"]
        include:
          # Extra OS coverage on one stable Python version. Not pinned to
          # a patch release: 3.12 now ships security fixes as source only,
          # so actions/python-versions has no Windows or macOS build of
          # 3.12.14, and "3.12" takes the newest one that exists.
          - os: windows-2025
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run Pyright (strict)
        run: pyright src tests

      # The live gates drive real Excel and opt in through RUN_LIVE_EXCEL,
      # which is never set here, so they skip.  Everything else runs: the
      # Excel-authored fixtures are committed, so no test silently skips for
      # want of a file CI cannot build.
      - name: Run pytest
        run: pytest -p no:randomly -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install build tooling
        run: python -m pip install --require-hashes -r .github/requirements/build.txt

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The one check the main ruleset requires. The matrix jobs are named
  # after their Python and runner, which change; this name does not. It
  # fails unless every job above passed, a skipped one included.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

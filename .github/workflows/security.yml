name: Security

# CodeQL and Semgrep over the package and the workflows that build and
# publish it, and ClamAV and YARA-X over every tracked file and the built
# packages. scripts/security/security_report.py then holds every finding,
# and every warning a tool raises about its scan, to
# .github/security/accepted.toml, and fails on anything that file does not
# account for. The publish workflow calls this one, so a release waits on
# it and carries the report it writes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily, so each day's ClamAV signatures, and new queries and rules,
    # reach code that has not changed.
    - cron: "23 5 * * *"
  # The YARA Forge updater starts this on its pull request's branch, since
  # a pull request its token opens starts no workflow of its own.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: sarif

      - name: Name the SARIF after its scan
        env:
          LANGUAGE: ${{ matrix.language }}
        run: mv sarif/*.sarif "codeql-$LANGUAGE.sarif"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-codeql-${{ matrix.language }}
          path: codeql-${{ matrix.language }}.sarif
          if-no-files-found: error

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install Semgrep
        run: python -m pip install --require-hashes -r .github/security/requirements.txt

      # --metrics=off: nothing about the scan leaves the runner.
      # --disable-nosem: a `nosemgrep` comment cannot hide a finding, so
      # accepting one goes through .github/security/accepted.toml. The long
      # timeout lets every rule finish on the largest files, since a rule
      # that times out has not checked that file.
      - name: Scan
        run: >-
          semgrep scan --metrics=off --disable-version-check --disable-nosem
          --timeout 120 --timeout-threshold 0
          --config p/default --config p/python --config p/security-audit
          --config p/secrets --config p/github-actions
          --sarif-output=semgrep.sarif
          src .github scripts/security

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: error

  # Every tracked file, the Excel fixtures included, and the built wheel
  # and sdist, scanned by ClamAV with the day's official signatures and by
  # YARA-X with YARA Forge's full public rule set. Each match becomes a
  # SARIF result for the report job, which holds it to the accepted list.
  malware:
    name: ClamAV and YARA-X
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The YARA-X engine. No updater follows a release download, so to
      # move it, pick a release at least a week old and take the digest
      # GitHub records for its asset:
      #   gh api repos/VirusTotal/yara-x/releases/tags/<tag> --jq '.assets[] | .name + " " + .digest'
      YARA_X_VERSION: v1.20.0
      YARA_X_SHA256: cabb8df46492fff59c51261302c71ed9cb2cef393d3f0ca560801a34a8e24cbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Export the tracked files and build the packages
        run: |
          mkdir -p scan/tree
          git archive HEAD | tar -x -C scan/tree
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation --outdir scan/dist
          ls -l scan/dist

      # The engine is pinned by digest in .github/security/clamav/Dockerfile;
      # the signatures are not, and freshclam fetches the current official
      # databases on every run, so a daily run sees each day's signatures.
      # --alert-macros reports every file holding a VBA project.
      - name: ClamAV
        run: |
          docker build -t clamav-pinned .github/security/clamav
          docker run --rm --entrypoint sh -v "$PWD/scan:/scan" -w /scan clamav-pinned -c '
            freshclam --stdout || exit 3
            clamscan --version > clamav-version.txt
            clamscan -r --infected --no-summary --alert-macros=yes --heuristic-alerts=yes tree dist > clamscan.txt
            rc=$?; [ "$rc" -le 1 ] || exit "$rc"'
          cat scan/clamav-version.txt scan/clamscan.txt

      # The rule set is pinned in .github/security/yara-forge.json, release
      # and SHA-256, and the YARA Forge updater proposes each new release in
      # a pull request that this workflow scans.
      - name: YARA-X with the pinned YARA Forge rules
        run: |
          curl -fsSL -o yara-x.tar.gz "https://github.com/VirusTotal/yara-x/releases/download/$YARA_X_VERSION/yara-x-$YARA_X_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$YARA_X_SHA256  yara-x.tar.gz" | sha256sum -c -
          tar -xzf yara-x.tar.gz yr
          pin=.github/security/yara-forge.json
          release=$(jq -r .release "$pin")
          package=$(jq -r .package "$pin")
          curl -fsSL -o rules.zip "https://github.com/YARAHQ/yara-forge/releases/download/$release/$(jq -r .asset "$pin")"
          echo "$(jq -r .sha256 "$pin")  rules.zip" | sha256sum -c -
          unzip -q rules.zip -d rules
          ./yr --version > scan/yara-version.txt
          echo "YARA Forge $release ($package)" >> scan/yara-version.txt
          cat scan/yara-version.txt
          # YARA-X warns that some rules use deprecated fields; they still
          # compile and run. The warnings go to a file, and a compile error
          # still fails the step.
          ./yr compile -o rules.yarc "rules/packages/$package/yara-rules-$package.yar" 2> yara-warnings.txt || { cat yara-warnings.txt; exit 1; }
          echo "$(grep -c '^warning' yara-warnings.txt) rule warnings"
          (cd scan && for target in tree dist; do
            ../yr scan --compiled-rules --recursive --disable-console-logs --output-format ndjson ../rules.yarc "$target"
          done > yara.ndjson)

      - name: Write the matches as SARIF
        run: python scripts/security/malware_sarif.py scan --out sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-malware
          path: sarif/*.sarif
          if-no-files-found: error

  report:
    name: Security report
    needs: [codeql, semgrep, malware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sarif-*
          path: security-report
          merge-multiple: true

      - name: Hold the findings to the accepted list
        run: >-
          python scripts/security/security_report.py security-report
          --accepted .github/security/accepted.toml
          --out security-report/security-report.md
          --require codeql-python --require codeql-actions --require semgrep
          --require clamav --require yara-x

      - name: Show the report on the run
        if: always()
        run: |
          if [ -f security-report/security-report.md ]; then
            cat security-report/security-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-report
          path: security-report/
          if-no-files-found: error
